[theme]
base = "light"
primaryColor = "#EF4444"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F172A"
borderColor = "#E2E8F0"
baseRadius = "medium"
buttonRadius = "medium"
font = "sans-serif"
codeFont = "monospace"

[theme.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F1F5F9"
textColor = "#334155"
borderColor = "#E2E8F0"

[client]
# Hide the built-in developer toolbar (Deploy button + main menu) so the
# public portal starts directly with the system header.
toolbarMode = "minimal"

[server]
runOnSave = true
